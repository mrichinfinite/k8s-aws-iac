---
- name: Check whether kubeadm has already initialized the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Initialize control plane
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --pod-network-cidr={{ calico_pod_cidr }}
      --apiserver-advertise-address={{ private_ip }}
  register: kubeadm_init
  when: not kubeadm_admin_conf.stat.exists

- name: Ensure kubeconfig directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Copy admin kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_path }}"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Read kubeadm join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_join_command
  changed_when: false

- name: Publish worker join command
  ansible.builtin.set_fact:
    worker_join_command: "{{ kubeadm_join_command.stdout }}"
