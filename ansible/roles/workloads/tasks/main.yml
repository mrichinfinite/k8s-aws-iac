---
- name: Copy nginx manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/nginx.yaml"
    dest: /tmp/nginx.yaml
    mode: "0644"

- name: Copy curl manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/curl.yaml"
    dest: /tmp/curl.yaml
    mode: "0644"

- name: Wait for Kubernetes nodes to become Ready
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=300s
  changed_when: false

- name: Wait for Calico node agents to become Ready
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      wait --for=condition=Ready
      pod
      -n calico-system
      -l k8s-app=calico-node
      --timeout=300s
  changed_when: false

- name: Apply nginx deployment and service
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      apply -f /tmp/nginx.yaml
  register: nginx_apply
  changed_when: "'configured' in nginx_apply.stdout or 'created' in nginx_apply.stdout"

- name: Reconcile curl test pod
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      replace --force -f /tmp/curl.yaml
  register: curl_replace
  changed_when: true
  failed_when:
    - curl_replace.rc != 0
    - "'not found' not in curl_replace.stderr | lower"

- name: Create curl test pod when absent
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf create -f /tmp/curl.yaml
  when: curl_replace.rc != 0
  changed_when: true

- name: Wait for nginx deployment rollout
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      rollout status deployment/nginx
      --timeout=180s
  changed_when: false

- name: Wait for curl pod
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf wait --for=condition=Ready pod/curl --timeout=180s
  changed_when: false
