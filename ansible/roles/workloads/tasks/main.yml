---
- name: Copy nginx manifest
  ansible.builtin.copy:
    src: nginx.yaml
    dest: /tmp/nginx.yaml
    mode: "0644"

- name: Copy curl manifest
  ansible.builtin.copy:
    src: curl.yaml
    dest: /tmp/curl.yaml
    mode: "0644"

- name: Wait for Kubernetes nodes to become Ready
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=300s
  changed_when: false

- name: Wait for Calico node agents to become Ready
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      wait --for=condition=Ready
      pod
      -n calico-system
      -l k8s-app=calico-node
      --timeout=300s
  changed_when: false

- name: Apply nginx deployment and service
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /tmp/nginx.yaml
  register: nginx_apply
  changed_when: "'configured' in nginx_apply.stdout or 'created' in nginx_apply.stdout"

- name: Apply curl test pod
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /tmp/curl.yaml
  register: curl_apply
  changed_when: "'configured' in curl_apply.stdout or 'created' in curl_apply.stdout"

- name: Wait for nginx pod
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf wait --for=condition=Ready pod/nginx --timeout=180s
  changed_when: false

- name: Wait for curl pod
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf wait --for=condition=Ready pod/curl --timeout=180s
  changed_when: false
