apiVersion: v1
kind: Pod
metadata:
  name: curl
spec:
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ["sleep", "3600"]
