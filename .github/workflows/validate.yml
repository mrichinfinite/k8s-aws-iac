name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static-validation:
    runs-on: ubuntu-latest

    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Install Ansible
        run: pip install "ansible-core==2.21.4"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Ansible syntax check
        run: |
          ansible-playbook -i ansible/inventory/aws.ini.example ansible/playbooks/site.yml --syntax-check
          ansible-playbook -i ansible/inventory/aws.ini.example ansible/playbooks/validate.yml --syntax-check
